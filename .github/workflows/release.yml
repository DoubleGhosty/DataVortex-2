name: Release (deprecated — distribution moved to Cloudflare R2)

# Distribution now goes through Cloudflare R2: the real client is built, code-signed and HMAC-injected
# LOCALLY by publish.ps1 (using _secrets/) and uploaded to R2 alongside latest.json. A CI runner has no
# _secrets/, so it would produce an unsigned, HMAC-off (non-functional) exe — therefore this workflow no
# longer runs on tag pushes. Kept for reference; can be run manually if a CI path is ever needed again.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Obfuscated single-file publish: build -> obfuscate Core+Licensing (Obfuscar, installed by the
      # script) -> publish --no-build so the bundle embeds the obfuscated assemblies. See publish.ps1.
      # Only the CLIENT is released publicly. The server is NOT — its turnkey bundle carries your signing PRIVATE
      # key, so it must never be published; you build it locally with publish-server.ps1 and deploy it privately.
      # DV_HMAC_KEY (repo secret) is injected into the client build so request signing matches the server; leave
      # the secret unset to ship with signing disabled.
      - name: Publish obfuscated single-file exe (client)
        shell: pwsh
        run: ./publish.ps1 -Output publish -Version ${{ steps.ver.outputs.version }} -HmacKey '${{ secrets.DV_HMAC_KEY }}'

      - name: Create release and upload exe
        uses: softprops/action-gh-release@v2
        with:
          name: DataVortex ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: publish/DataVortex.exe
          generate_release_notes: true
